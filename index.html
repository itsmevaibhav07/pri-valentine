<body>

<div class="background"></div>
<div class="particles"></div>
<div class="bouquet-left"></div>

<section class="hero reveal">
    <h1>You Are My Universe 🌌</h1>
    <p>
        In every timeline, in every world,
        I would still search for you.
        And I would still fall for you.
    </p>
</section>

<section class="gallery reveal">
    <div class="photo"><img src="pri1.jpg"></div>
    <div class="photo"><img src="pri2.jpg"></div>
    <div class="photo"><img src="pri3.jpg"></div>
    <div class="photo"><img src="pri4.jpg"></div>
</section>

<section class="love-text reveal">
    <h2>My Safe Place 💗</h2>
    <p>
        You are the calm in my chaos,
        the softness in my storms,
        the poetry I never knew
        I was capable of writing.
    </p>
    <p>
        If love had a form,
        it would look exactly like you.
    </p>
</section>
